name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }} (${{ matrix.configuration }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        target: [cli, gui]
        configuration: [Debug, Release]
        include:
          - target: cli
            project: DecUbiSnd.vcxproj
          - target: gui
            project: DecUbiSndGui.vcxproj

    steps:
      - name: Check out project
        uses: actions/checkout@v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          gui: ${{ matrix.target == 'gui' }}

      - name: Build
        run: msbuild .\${{ matrix.project }} /m /p:Configuration=${{ matrix.configuration }} /p:Platform=Win32 /verbosity:minimal

      - name: Package
        run: .\.github\scripts\package.ps1 -Configuration ${{ matrix.configuration }} -Target ${{ matrix.target }} -Output package

      - name: Upload package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: DecUbiSnd-${{ matrix.target }}-win32-${{ matrix.configuration }}
          path: package/
          if-no-files-found: error
          retention-days: 14
