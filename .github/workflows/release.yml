name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          gui: 'true'

      - name: Build CLI
        run: msbuild .\DecUbiSnd.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /verbosity:minimal

      - name: Build GUI
        run: msbuild .\DecUbiSndGui.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /verbosity:minimal

      - name: Package
        run: |
          .\.github\scripts\package.ps1 -Configuration Release -Target all -Output package
          Compress-Archive -Path package\* -DestinationPath "DecUbiSnd-${{ github.ref_name }}-win32.zip"

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "DecUbiSnd-${{ github.ref_name }}-win32.zip"
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" $zip --clobber
          } else {
            gh release create "${{ github.ref_name }}" $zip --title "${{ github.ref_name }}" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
